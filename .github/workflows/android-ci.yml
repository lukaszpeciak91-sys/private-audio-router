name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JVM tests, lint, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run JVM tests and builds
        run: ./gradlew testDebugUnitTest assembleDebug bundleRelease

      - name: Run Android lint and print the complete report
        shell: bash
        run: |
          set +e
          ./gradlew lintDebug
          lint_status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"

          if [[ -f "$report" ]]; then
            echo "::group::Complete Android lint report"
            cat "$report"
            echo "::endgroup::"
          else
            echo "Android lint text report was not generated at: $report"
          fi

          python3 - "$report" <<'PY'
          import pathlib
          import re
          import sys

          report = pathlib.Path(sys.argv[1])
          repository_root = pathlib.Path.cwd().resolve()
          if not report.is_file():
              print(f"Cannot enforce the lint warning policy: missing {report}", file=sys.stderr)
              sys.exit(1)

          accepted = {
              ("app/build.gradle.kts", "OldTargetApi", "Not targeting the latest versions of Android; compatibility modes apply. Consider testing and updating this version. Consult the android.os.Build.VERSION_CODES javadoc for details."),
              ("app/build.gradle.kts", "GradleDependency", "A newer version of compileSdk than 36 is available: 37"),
          }
          gradle_advisory_path = "gradle/wrapper/gradle-wrapper.properties"
          gradle_advisory_issue = "AndroidGradlePluginVersion"
          gradle_advisory_prefix = "A newer version of Gradle than 9.5.0 is available: "
          pinned_gradle_version = (9, 5, 0)
          version_shape = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")

          def is_accepted(finding):
              path, issue, message = finding
              if finding in accepted:
                  return True
              if path != gradle_advisory_path or issue != gradle_advisory_issue:
                  return False
              if not message.startswith(gradle_advisory_prefix):
                  return False
              suggested = message[len(gradle_advisory_prefix):]
              if version_shape.fullmatch(suggested) is None:
                  return False
              suggested_version = tuple(int(part) for part in suggested.split("."))
              return suggested_version > pinned_gradle_version

          policy_contract_cases = [
              ((gradle_advisory_path, gradle_advisory_issue, gradle_advisory_prefix + "9.8.1"), True),
              (("app/build.gradle.kts", gradle_advisory_issue, gradle_advisory_prefix + "9.8.1"), False),
              ((gradle_advisory_path, "GradleDependency", gradle_advisory_prefix + "9.8.1"), False),
              ((gradle_advisory_path, gradle_advisory_issue, "A newer version of Gradle than 9.4.0 is available: 9.8.1"), False),
              ((gradle_advisory_path, gradle_advisory_issue, gradle_advisory_prefix + "9.8"), False),
              ((gradle_advisory_path, gradle_advisory_issue, gradle_advisory_prefix + "9.8.1-preview"), False),
              ((gradle_advisory_path, gradle_advisory_issue, gradle_advisory_prefix + "9.5.0"), False),
          ]
          for finding, expected in policy_contract_cases:
              actual = is_accepted(finding)
              if actual != expected:
                  print(f"Lint warning policy contract failed for {finding}: expected {expected}, got {actual}", file=sys.stderr)
                  sys.exit(1)

          header = re.compile(r"^(.*?):\d+: Warning: (.*) \[([^]]+)]$")
          findings = []
          for line in report.read_text(encoding="utf-8").splitlines():
              match = header.match(line)
              if not match:
                  continue
              path, message, issue = match.groups()
              finding_path = pathlib.Path(path)
              if not finding_path.is_absolute():
                  finding_path = repository_root / finding_path
              try:
                  normalized_path = finding_path.resolve().relative_to(repository_root).as_posix()
              except ValueError:
                  normalized_path = finding_path.resolve().as_posix()
              findings.append((normalized_path, issue, message))

          unexpected = [finding for finding in findings if not is_accepted(finding)]
          if unexpected:
              print("Unexpected Android lint warning(s):", file=sys.stderr)
              for path, issue, message in unexpected:
                  print(f"- {path}: {message} [{issue}]", file=sys.stderr)
              sys.exit(1)
          print(f"Lint warning policy passed ({len(findings)} accepted warning(s), 0 unexpected).")
          PY
          warning_policy_status=$?

          if (( lint_status != 0 )); then
            exit "$lint_status"
          fi
          exit "$warning_policy_status"

name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JVM tests, lint, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run JVM tests and builds
        run: ./gradlew testDebugUnitTest assembleDebug bundleRelease

      - name: Run Android lint and print the complete report
        shell: bash
        run: |
          set +e
          ./gradlew lintDebug
          lint_status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"

          if [[ -f "$report" ]]; then
            echo "::group::Complete Android lint report"
            cat "$report"
            echo "::endgroup::"
          else
            echo "Android lint text report was not generated at: $report"
          fi

          exit "$lint_status"

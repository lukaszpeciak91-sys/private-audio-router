name: Android CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: JVM tests, lint, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run JVM tests and builds
        run: ./gradlew testDebugUnitTest assembleDebug bundleRelease

      - name: Run Android lint and print the complete report
        shell: bash
        run: |
          set +e
          ./gradlew lintDebug
          lint_status=$?
          report="app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"

          if [[ -f "$report" ]]; then
            echo "::group::Complete Android lint report"
            cat "$report"
            echo "::endgroup::"
          else
            echo "Android lint text report was not generated at: $report"
          fi

          python3 - "$report" <<'PY'
          import pathlib
          import re
          import sys

          report = pathlib.Path(sys.argv[1])
          if not report.is_file():
              print(f"Cannot enforce the lint warning policy: missing {report}", file=sys.stderr)
              sys.exit(1)

          accepted = {
              ("app/build.gradle.kts", "OldTargetApi", "Not targeting the latest versions of Android; compatibility modes apply. Consider testing and updating this version."),
              ("gradle/wrapper/gradle-wrapper.properties", "AndroidGradlePluginVersion", "A newer version of Gradle than 9.5.0 is available: 9.7.1"),
              ("app/build.gradle.kts", "GradleDependency", "A newer version of compileSdk than 36 is available: 37"),
          }
          header = re.compile(r"^(.*?):\d+: Warning: (.*) \[([^]]+)]$")
          findings = []
          for line in report.read_text(encoding="utf-8").splitlines():
              match = header.match(line)
              if not match:
                  continue
              path, message, issue = match.groups()
              normalized_path = path.replace("\\", "/")
              marker = "/private-audio-router/"
              if marker in normalized_path:
                  normalized_path = normalized_path.split(marker, 1)[1]
              findings.append((normalized_path, issue, message))

          unexpected = [finding for finding in findings if finding not in accepted]
          if unexpected:
              print("Unexpected Android lint warning(s):", file=sys.stderr)
              for path, issue, message in unexpected:
                  print(f"- {path}: {message} [{issue}]", file=sys.stderr)
              sys.exit(1)
          print(f"Lint warning policy passed ({len(findings)} accepted warning(s), 0 unexpected).")
          PY
          warning_policy_status=$?

          if (( lint_status != 0 )); then
            exit "$lint_status"
          fi
          exit "$warning_policy_status"
